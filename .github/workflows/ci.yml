name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run linter
      run: npm run lint

    - name: Run acceptance tests
      env:
        NODE_ENV: test
        ADMIN_PIN: "InvictorsAdmin#2026"
        EVENT_SALT: "final_override_secure_salt_vvce_998877"
        SHARD_SECRET: "shard_secret_override_token_77665544"
      run: npm test
