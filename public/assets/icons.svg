<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Radio Signal / Radar -->
    <g id="icon-signal">
      <path d="M2 20h20M5 20a7 7 0 0 1 14 0M8 20a4 4 0 0 1 8 0M11 20a1 1 0 0 1 2 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Cipher Lock -->
    <g id="icon-lock">
      <rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
    </g>

    <!-- Neural Terminal / AI Bot -->
    <g id="icon-terminal">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M7 8l4 4-4 4M13 16h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- CTF Flag -->
    <g id="icon-flag">
      <path d="M4 22V3M4 4h12l-2 5 2 5H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Team Sync / Squad -->
    <g id="icon-users">
      <circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75M22 21v-2a4 4 0 0 0-3-3.87" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <!-- Success Check -->
    <g id="icon-check">
      <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Alert / Warning -->
    <g id="icon-alert">
      <path d="M12 2L2 20h20L12 2zM12 9v5M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Clock / Timer -->
    <g id="icon-clock">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Copy -->
    <g id="icon-copy">
      <rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <!-- Undo -->
    <g id="icon-undo">
      <path d="M3 7v6h6M3 13a9 9 0 1 1 2.8 6.4L3 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Help / Support -->
    <g id="icon-help">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Trophy / Leaderboard -->
    <g id="icon-trophy">
      <path d="M6 9V4h12v5a6 6 0 0 1-12 0zM12 15v4M8 22h8M6 5H3a2 2 0 0 0-2 2v1a4 4 0 0 0 4 4h1M18 5h3a2 2 0 0 1 2 2v1a4 4 0 0 1-4 4h-1" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <!-- Portal / Gamepad -->
    <g id="icon-gamepad">
      <rect x="2" y="6" width="20" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
</svg>
